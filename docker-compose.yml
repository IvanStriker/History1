services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: appdb
    expose:
      - "5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d appdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rag:
    build: ./RAG
    expose:
      - "8001"
    environment:
      MISTRAL_API_KEY: ZvMLZdits0HwToXTM3E9NopLVyQgImAs
      DATA_DIR: /data
    volumes:
      - ./RAG/data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: .
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      rag:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/appdb
      SECRET_KEY: change-me-in-production
      OPENAI_API_KEY: ZvMLZdits0HwToXTM3E9NopLVyQgImAs
      RAG_URL: http://rag:8001
    volumes:
      - ./static/images:/app/static/images
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  certbot-init:
    image: certbot/certbot
    ports:
      - "80:80"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
    command: >
      certonly --standalone
      --non-interactive --agree-tos
      --email ivanstrikeraddress@gmail.com
      -d 82.117.87.36.nip.io
      --keep-until-expiring

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: >
      sh -c "while :; do sleep 6h & wait; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      certbot-init:
        condition: service_completed_successfully
      web:
        condition: service_started

  certbot-renew:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done"
    depends_on:
      - nginx