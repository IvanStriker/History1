services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: appdb
    expose:
      - "5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d appdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rag:
    build:
      context: ../RAG
      dockerfile: Dockerfile
    expose:
      - "8001"
    environment:
      MISTRAL_API_KEY: ZvMLZdits0HwToXTM3E9NopLVyQgImAs
      DATA_DIR: /data
    volumes:
      - ../RAG/data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: development/Dockerfile
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      rag:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/appdb
      SECRET_KEY: dev-secret-key
      OPENAI_API_KEY: ZvMLZdits0HwToXTM3E9NopLVyQgImAs
      RAG_URL: http://rag:8001
    volumes:
      - ../static/images:/app/static/images
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../static:/app/static
    depends_on:
      web:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: vinogradovivan548@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 11111111