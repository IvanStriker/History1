<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Историческая игра{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  />

  <!-- Google Fonts: Cinzel Decorative + EB Garamond -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  />

  <!-- Применяем сохранённые настройки ДО рендера страницы (предотвращает FOUC) -->
  <script src="{{ url_for('static', filename='js/settings-apply.js') }}"></script>

  <!-- Базовые стили: фон, зерно, панель вкладок -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />

  <!-- Специфические стили страницы -->
  {% block head_extra %}{% endblock %}
</head>
<body {% block body_attrs %}{% endblock %}>

  <!-- Phaser рисует фоновые частицы в этот контейнер -->
  <div id="phaser-bg" aria-hidden="true"></div>

  <!-- Панель вкладок (переопределяется на странице тренировки) -->
  {% block navbar %}
  <nav class="tab-nav" role="navigation" aria-label="Основная навигация">

    <a href="/home"
       class="tab-nav__item{% if request.path in ('/', '/home') %} tab-nav__item--active{% endif %}"
       aria-label="Главная страница">
      <svg class="tab-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span>Дом</span>
    </a>

    <a href="/settings"
       class="tab-nav__item{% if request.path == '/settings' %} tab-nav__item--active{% endif %}"
       aria-label="Настройки">
      <svg class="tab-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.01 7.01 0 0 0-1.62-.94l-.36-2.54A.484.484 0 0 0 14 2h-4c-.25 0-.46.18-.49.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.476.476 0 0 0-.59.22L2.63 8.54a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.49.42h4c.25 0 .46-.18.49-.42l.36-2.54a6.99 6.99 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
      <span>Настройки</span>
    </a>

    <a href="/sign-in"
       class="tab-nav__item{% if request.path == '/sign-in' %} tab-nav__item--active{% endif %}"
       aria-label="Вход в аккаунт">
      <svg class="tab-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
      </svg>
      <span>Вход</span>
    </a>

    <a href="/sign-up"
       class="tab-nav__item{% if request.path == '/sign-up' %} tab-nav__item--active{% endif %}"
       aria-label="Регистрация">
      <svg class="tab-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      <span>Регистрация</span>
    </a>

    {% if current_user %}
    <a href="/profile"
       class="tab-nav__item{% if request.path == '/profile' %} tab-nav__item--active{% endif %}"
       aria-label="Профиль">
      <svg class="tab-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      <span>Профиль</span>
    </a>
    {% endif %}

  </nav>
  {% endblock %}

  <!-- Контент страницы -->
  {% block body_content %}{% endblock %}

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Базовый JS: фоновая анимация (работает на всех страницах) -->
  <script src="{{ url_for('static', filename='js/base.js') }}"></script>

  <!-- Специфические скрипты страницы -->
  {% block scripts %}{% endblock %}
</body>
</html>
